rules:
  - id: python-dangerous-eval
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: Use of eval() or exec() enables arbitrary code execution on untrusted input.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"

  - id: python-command-injection-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
    message: Spawning subprocesses with shell=True is susceptible to OS command injection.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"

  - id: python-insecure-yaml-load
    pattern: yaml.load($ARG, Loader=yaml.Loader)
    message: Insecure deserialization with yaml.load and unsafe Loader. Use yaml.safe_load instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  - id: python-weak-cryptographic-hash
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    message: MD5 and SHA1 are cryptographically broken hash algorithms and must not be used for security.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: python-dangerous-tempfile
    pattern: tempfile.mktemp(...)
    message: tempfile.mktemp() is insecure due to race conditions between filename creation and file opening. Use tempfile.NamedTemporaryFile() instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-377: Insecure Temporary File"
      owasp: "A01:2021 - Broken Access Control"

  - id: python-os-system-call
    pattern: os.system(...)
    message: os.system() executes a command in a subshell and is vulnerable to command injection.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  - id: generic-hardcoded-secret
    pattern-regex: '(?i)(api[_-]?key|secret[_-]?key|auth[_-]?token|private[_-]?key)\s*[:=]\s*["''][A-Za-z0-9+/=_\-]{20,}["'']'
    message: Hardcoded authentication token, API key, or cryptographic secret detected.
    languages: [generic]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
